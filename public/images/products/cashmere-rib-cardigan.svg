<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Nadia Cashmere Rib Cardigan">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4" />
      <stop offset="100%" stop-color="#EFEAE0" />
    </linearGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C1C19" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#1C1C19" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#1C1C19" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1C1C19" flood-opacity="0.12" />
    </filter>
    <pattern id="linenWeave" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 0 3 L 6 3 M 3 0 L 3 6" stroke="#1C1C19" stroke-width="0.35" stroke-opacity="0.045" />
    </pattern>
  </defs>
  <rect width="600" height="800" fill="url(#bgGrad)" />
  <ellipse cx="300" cy="705" rx="185" ry="26" fill="url(#floorShadow)" />
  
    
    <path d="M300 70 C300 54 318 50 320 66 C322 78 302 82 300 92" fill="none" stroke="#9B7B4F" stroke-width="4" stroke-linecap="round"/>
    <path d="M180 134 Q300 94 420 134 L416 144 Q300 108 184 144 Z" fill="#5A4230" stroke="#3D2B1F" stroke-width="1.5"/>
  
    <g filter="url(#softShadow)">
      <linearGradient id="oatKnit" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#EDE7D6" />
        <stop offset="100%" stop-color="#D8CEB8" />
      </linearGradient>
      <!-- Sleeves -->
      <path d="M196 154 L118 430 L166 444 L224 235 Z" fill="url(#oatKnit)" stroke="#BDB29B" stroke-width="1.5"/>
      <path d="M404 154 L482 430 L434 444 L376 235 Z" fill="url(#oatKnit)" stroke="#BDB29B" stroke-width="1.5"/>
      <!-- Body -->
      <path d="M244 130 Q300 155 356 130 L404 154 L392 496 Q300 506 208 496 L196 154 Z" fill="url(#oatKnit)" stroke="#BDB29B" stroke-width="1.5"/>
      <!-- Ribbing vertical lines -->
      <g stroke="#C6BBA4" stroke-width="1" opacity="0.6">
        <line x1="230" y1="160" x2="226" y2="480"/>
        <line x1="255" y1="190" x2="255" y2="480"/>
        <line x1="345" y1="190" x2="345" y2="480"/>
        <line x1="370" y1="160" x2="374" y2="480"/>
      </g>
      <!-- V-neck & Button Placket -->
      <path d="M244 130 L300 260 L356 130" fill="#FAF8F4" stroke="#BDB29B" stroke-width="1.5"/>
      <rect x="292" y="255" width="16" height="242" fill="#E1D8C3" stroke="#BDB29B" stroke-width="1"/>
      <circle cx="300" cy="285" r="5.5" fill="#7D5836"/>
      <circle cx="300" cy="335" r="5.5" fill="#7D5836"/>
      <circle cx="300" cy="385" r="5.5" fill="#7D5836"/>
      <circle cx="300" cy="435" r="5.5" fill="#7D5836"/>
      <!-- Ribbed Hem & Cuffs -->
      <rect x="208" y="472" width="184" height="26" rx="2" fill="#D5CAB2" stroke="#BDB29B" stroke-width="1.2"/>
    </g>
</svg>
