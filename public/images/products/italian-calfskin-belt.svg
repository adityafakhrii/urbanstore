<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Brushed-Brass Calfskin Belt">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4" />
      <stop offset="100%" stop-color="#EFEAE0" />
    </linearGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C1C19" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#1C1C19" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#1C1C19" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1C1C19" flood-opacity="0.12" />
    </filter>
    <pattern id="linenWeave" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 0 3 L 6 3 M 3 0 L 3 6" stroke="#1C1C19" stroke-width="0.35" stroke-opacity="0.045" />
    </pattern>
  </defs>
  <rect width="600" height="800" fill="url(#bgGrad)" />
  <ellipse cx="300" cy="705" rx="185" ry="26" fill="url(#floorShadow)" />
  
    <g filter="url(#softShadow)">
      <!-- Coiled Leather Strap -->
      <ellipse cx="300" cy="410" rx="178" ry="155" fill="none" stroke="#3B2B23" stroke-width="46"/>
      <ellipse cx="300" cy="410" rx="154" ry="131" fill="none" stroke="#5A4337" stroke-width="3"/>
      <!-- Tail with Sizing Holes -->
      <path d="M122 410 L460 540 L488 498 L160 368 Z" fill="#46332A" stroke="#241812" stroke-width="1.5"/>
      <circle cx="400" cy="492" r="4" fill="#FAF8F4"/>
      <circle cx="425" cy="502" r="4" fill="#FAF8F4"/>
      <circle cx="450" cy="512" r="4" fill="#FAF8F4"/>
      <!-- Brushed Brass Buckle -->
      <rect x="115" y="348" width="66" height="86" rx="12" fill="none" stroke="#C59E54" stroke-width="11"/>
      <line x1="145" y1="391" x2="184" y2="391" stroke="#C59E54" stroke-width="6" stroke-linecap="round"/>
    </g>
</svg>
