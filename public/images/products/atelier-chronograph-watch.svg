<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Chrono Minimalist Leather Watch">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4" />
      <stop offset="100%" stop-color="#EFEAE0" />
    </linearGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C1C19" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#1C1C19" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#1C1C19" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1C1C19" flood-opacity="0.12" />
    </filter>
    <pattern id="linenWeave" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 0 3 L 6 3 M 3 0 L 3 6" stroke="#1C1C19" stroke-width="0.35" stroke-opacity="0.045" />
    </pattern>
  </defs>
  <rect width="600" height="800" fill="url(#bgGrad)" />
  <ellipse cx="300" cy="705" rx="185" ry="26" fill="url(#floorShadow)" />
  
    <g filter="url(#softShadow)">
      <!-- Leather Strap Top & Bottom -->
      <rect x="242" y="112" width="116" height="175" rx="14" fill="#9E8D7B" stroke="#746555" stroke-width="2"/>
      <rect x="242" y="513" width="116" height="175" rx="14" fill="#9E8D7B" stroke="#746555" stroke-width="2"/>
      <line x1="256" y1="126" x2="256" y2="275" stroke="#B7A694" stroke-width="1.4" stroke-dasharray="4 4"/>
      <line x1="344" y1="126" x2="344" y2="275" stroke="#B7A694" stroke-width="1.4" stroke-dasharray="4 4"/>
      <line x1="256" y1="525" x2="256" y2="674" stroke="#B7A694" stroke-width="1.4" stroke-dasharray="4 4"/>
      <line x1="344" y1="525" x2="344" y2="674" stroke="#B7A694" stroke-width="1.4" stroke-dasharray="4 4"/>
      <!-- Watch Case & Crown -->
      <rect x="424" y="384" width="18" height="32" rx="4" fill="#B8B6B0" stroke="#75736E" stroke-width="1.5"/>
      <circle cx="300" cy="400" r="132" fill="#D4D2CC" stroke="#8B8982" stroke-width="3"/>
      <circle cx="300" cy="400" r="114" fill="#FAF7F0" stroke="#BDBAB2" stroke-width="1.5"/>
      <!-- Baton Indices -->
      <g stroke="#1C1C19" stroke-width="2.5" stroke-linecap="round">
        <line x1="300" y1="298" x2="300" y2="314"/>
        <line x1="300" y1="486" x2="300" y2="502"/>
        <line x1="198" y1="400" x2="214" y2="400"/>
        <line x1="386" y1="400" x2="402" y2="400"/>
      </g>
      <!-- Hands -->
      <line x1="300" y1="400" x2="300" y2="330" stroke="#1C1C19" stroke-width="4" stroke-linecap="round"/>
      <line x1="300" y1="400" x2="358" y2="424" stroke="#855224" stroke-width="3" stroke-linecap="round"/>
      <circle cx="300" cy="400" r="6" fill="#1C1C19"/>
    </g>
</svg>
