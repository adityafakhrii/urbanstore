<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Celine Square-Toe Leather Mule">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4" />
      <stop offset="100%" stop-color="#EFEAE0" />
    </linearGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C1C19" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#1C1C19" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#1C1C19" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1C1C19" flood-opacity="0.12" />
    </filter>
    <pattern id="linenWeave" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 0 3 L 6 3 M 3 0 L 3 6" stroke="#1C1C19" stroke-width="0.35" stroke-opacity="0.045" />
    </pattern>
  </defs>
  <rect width="600" height="800" fill="url(#bgGrad)" />
  <ellipse cx="300" cy="705" rx="185" ry="26" fill="url(#floorShadow)" />
  
    <g filter="url(#softShadow)">
      <linearGradient id="butterMule" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F6EEDF" />
        <stop offset="100%" stop-color="#DFD2BC" />
      </linearGradient>
      <rect x="110" y="595" width="380" height="82" rx="8" fill="#E3DCD0" stroke="#CBC2B1" stroke-width="1.5"/>
      <!-- Footbed & Sculpted Heel -->
      <path d="M134 522 L472 558 L468 576 L210 576 L202 595 L134 595 Z" fill="#4B372A" stroke="#2E2017" stroke-width="1.5"/>
      <!-- Square-Toe Leather Upper -->
      <path d="M235 452 Q335 446 465 508 L470 558 L232 558 Q215 505 235 452 Z" fill="url(#butterMule)" stroke="#BFB19A" stroke-width="1.8"/>
      <path d="M250 482 Q348 486 452 528" fill="none" stroke="#CBBFA9" stroke-width="1.4" stroke-dasharray="4 3"/>
    </g>
</svg>
