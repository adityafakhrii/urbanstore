<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Solano Minimalist Leather Sneaker">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4" />
      <stop offset="100%" stop-color="#EFEAE0" />
    </linearGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C1C19" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#1C1C19" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#1C1C19" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1C1C19" flood-opacity="0.12" />
    </filter>
    <pattern id="linenWeave" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 0 3 L 6 3 M 3 0 L 3 6" stroke="#1C1C19" stroke-width="0.35" stroke-opacity="0.045" />
    </pattern>
  </defs>
  <rect width="600" height="800" fill="url(#bgGrad)" />
  <ellipse cx="300" cy="705" rx="185" ry="26" fill="url(#floorShadow)" />
  
    <g filter="url(#softShadow)">
      <linearGradient id="chalkSneaker" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="100%" stop-color="#ECE7DC" />
      </linearGradient>
      <rect x="95" y="595" width="410" height="82" rx="8" fill="#E5DEC9" stroke="#CEC5AD" stroke-width="1.5"/>
      <!-- Upper -->
      <path d="M118 468 Q145 415 198 446 Q275 462 342 465 Q468 488 486 544 L118 544 Z" fill="url(#chalkSneaker)" stroke="#C8C0B0" stroke-width="1.8"/>
      <!-- Taupe Suede Heel Tab -->
      <path d="M118 468 Q142 428 168 438 L178 492 L118 496 Z" fill="#B5A695" stroke="#8F8070" stroke-width="1.2"/>
      <!-- Laces -->
      <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
        <line x1="252" y1="454" x2="275" y2="465"/>
        <line x1="274" y1="464" x2="298" y2="474"/>
        <line x1="296" y1="473" x2="320" y2="483"/>
        <line x1="318" y1="482" x2="342" y2="492"/>
      </g>
      <!-- Cupsole -->
      <rect x="115" y="544" width="374" height="50" rx="14" fill="#F2ECE0" stroke="#C8C0B0" stroke-width="1.6"/>
      <line x1="126" y1="556" x2="478" y2="556" stroke="#D5CCBA" stroke-width="1.2" stroke-dasharray="4 4"/>
    </g>
</svg>
