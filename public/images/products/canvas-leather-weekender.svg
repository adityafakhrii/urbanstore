<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Surya Canvas & Leather Duffel">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4" />
      <stop offset="100%" stop-color="#EFEAE0" />
    </linearGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C1C19" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#1C1C19" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#1C1C19" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1C1C19" flood-opacity="0.12" />
    </filter>
    <pattern id="linenWeave" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 0 3 L 6 3 M 3 0 L 3 6" stroke="#1C1C19" stroke-width="0.35" stroke-opacity="0.045" />
    </pattern>
  </defs>
  <rect width="600" height="800" fill="url(#bgGrad)" />
  <ellipse cx="300" cy="705" rx="185" ry="26" fill="url(#floorShadow)" />
  
    <g filter="url(#softShadow)">
      <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#EFE9DA" />
        <stop offset="100%" stop-color="#DCD3BF" />
      </linearGradient>
      <!-- Top Handles -->
      <path d="M225 320 C225 215 375 215 375 320" fill="none" stroke="#855224" stroke-width="16" stroke-linecap="round"/>
      <!-- Canvas Body -->
      <rect x="92" y="318" width="416" height="295" rx="34" fill="url(#canvasGrad)" stroke="#C2B8A3" stroke-width="2"/>
      <rect x="92" y="318" width="416" height="295" rx="34" fill="url(#linenWeave)" />
      <!-- Tan Leather Straps & Base Trim -->
      <rect x="195" y="318" width="26" height="295" fill="#8B5628" stroke="#623A18" stroke-width="1.2"/>
      <rect x="379" y="318" width="26" height="295" fill="#8B5628" stroke="#623A18" stroke-width="1.2"/>
      <path d="M92 552 L508 552 L508 579 Q508 613 474 613 L126 613 Q92 613 92 579 Z" fill="#7D4C22" stroke="#583415" stroke-width="1.5"/>
      <!-- Brass Buckles -->
      <rect x="191" y="425" width="34" height="22" rx="4" fill="#D5B26B" stroke="#8F7033" stroke-width="1.2"/>
      <rect x="375" y="425" width="34" height="22" rx="4" fill="#D5B26B" stroke="#8F7033" stroke-width="1.2"/>
    </g>
</svg>
